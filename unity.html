<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebXR | WebAR6</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #unity-container {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #000;
      }
      #unity-warning {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning" style="display: none !important;"></div>
    </div>

    <script>
      // Отключаем стриминг-компиляцию, чтобы обойти ошибку Content-Encoding на GitHub Pages
      if (typeof WebAssembly.compileStreaming !== 'undefined') {
        WebAssembly.compileStreaming = undefined;
      }
      if (typeof WebAssembly.instantiateStreaming !== 'undefined') {
        WebAssembly.instantiateStreaming = undefined;
      }

      var canvas = document.querySelector("#unity-canvas");

      // Глушим некритические предупреждения о сжатии
      function unityShowBanner(msg, type) {
        console.warn("Unity log:", msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/prac3.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/prac3.data",
        frameworkUrl: buildUrl + "/prac3.framework.js",
        codeUrl: buildUrl + "/prac3.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebAR6",
        productVersion: "0.1",
        showBanner: unityShowBanner
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          console.error(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
